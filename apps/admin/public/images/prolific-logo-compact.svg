<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72" role="img" aria-label="PNN - Prolific News Network">
  <defs>
    <linearGradient id="pnnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE047" />
      <stop offset="50%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#D49B00" />
    </linearGradient>
    <linearGradient id="pnnCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B80008" />
    </linearGradient>
    <linearGradient id="pnnNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003359" />
      <stop offset="100%" stop-color="#001526" />
    </linearGradient>
    <filter id="pnnDrop" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- LEFT EMBLEM: PNN BROADCAST MONOGRAM CREST (Pure Vector Paths - Zero Font Dependency) -->
  <g transform="translate(6, 6)" filter="url(#pnnDrop)">
    <!-- Outer Gold Bevel Frame -->
    <rect x="0" y="0" width="68" height="60" rx="9" fill="url(#pnnGold)" />
    <!-- Inner Deep Navy Broadcast Studio Core -->
    <rect x="2.5" y="2.5" width="63" height="55" rx="7" fill="url(#pnnNavy)" />

    <!-- Subtle Global Broadcast Grid Arcs -->
    <ellipse cx="34" cy="30" rx="26" ry="20" fill="none" stroke="#004C80" stroke-width="0.9" stroke-dasharray="3 2" opacity="0.65" />
    <path d="M 8 18 Q 34 26 60 18" fill="none" stroke="#004C80" stroke-width="0.8" opacity="0.5" />
    <path d="M 8 42 Q 34 34 60 42" fill="none" stroke="#004C80" stroke-width="0.8" opacity="0.5" />

    <!-- Top Crimson Broadcast Signal Bar -->
    <rect x="10" y="6.5" width="48" height="4" rx="2" fill="url(#pnnCrimson)" />
    <!-- Live Signal Beacon Dot -->
    <circle cx="58" cy="8.5" r="2.5" fill="#FFE047" />

    <!-- Pure Vector "PNN" Interlocking Monogram -->
    <!-- Letter P (x: 8..23, y: 16..42) -->
    <path d="M 8.5 16 H 17.5 C 21.2 16 23.5 18.2 23.5 21.8 C 23.5 25.4 21.2 27.6 17.5 27.6 H 13.5 V 36 H 8.5 V 16 Z M 13.5 20.2 V 23.6 H 16.8 C 18.2 23.6 19 22.9 19 21.9 C 19 20.9 18.2 20.2 16.8 20.2 H 13.5 Z" fill="#FFFFFF" />
    <!-- First Letter N (x: 25.5..41.5, y: 16..36) -->
    <path d="M 25.5 16 H 30.2 L 36.8 27.4 V 16 H 41.3 V 36 H 36.6 L 30.0 24.6 V 36 H 25.5 V 16 Z" fill="url(#pnnGold)" />
    <!-- Second Letter N (x: 43.5..59.5, y: 16..36) -->
    <path d="M 43.5 16 H 48.2 L 54.8 27.4 V 16 H 59.3 V 36 H 54.6 L 48.0 24.6 V 36 H 43.5 V 16 Z" fill="url(#pnnGold)" />

    <!-- Bottom Micro-Banner inside Crest: 24/7 LIVE -->
    <rect x="9" y="41" width="50" height="11" rx="3" fill="#00101D" stroke="#00487C" stroke-width="0.8" />
    <circle cx="15.5" cy="46.5" r="2.2" fill="#FF1E27" />
    <text x="37" y="49.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="7.5" letter-spacing="1.2" fill="#FFE047" text-anchor="middle">24/7 LIVE</text>
  </g>

  <!-- RIGHT LOCKUP: STACKED 2-TIER BROADCAST WORDMARK (Physically Impossible to Overlap) -->
  <!-- TIER 1 (TOP): PROLIFIC -->
  <text
    x="86"
    y="35"
    textLength="196"
    lengthAdjust="spacing"
    font-family="'Oswald', 'Arial Black', 'Segoe UI', Impact, system-ui, sans-serif"
    font-weight="900"
    font-size="30"
    fill="#FFFFFF"
    filter="url(#pnnDrop)"
  >PROLIFIC</text>

  <!-- Top-Right Global Authority Pill -->
  <g transform="translate(292, 14)">
    <rect x="0" y="0" width="60" height="18" rx="3" fill="#001829" stroke="#004C80" stroke-width="1" />
    <circle cx="9" cy="9" r="2.5" fill="#10B981" />
    <text x="34" y="12.2" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="8" letter-spacing="1" fill="#A3CBE8" text-anchor="middle">GLOBAL</text>
  </g>

  <!-- Gold Precision Divider Rule -->
  <line x1="86" y1="41.5" x2="352" y2="41.5" stroke="url(#pnnGold)" stroke-width="1.2" opacity="0.75" />

  <!-- TIER 2 (BOTTOM): [ NEWS ] + NETWORK + .NEWS -->
  <g transform="translate(86, 46)">
    <!-- Crimson Broadcast NEWS Ribbon -->
    <rect x="0" y="0" width="66" height="19" rx="3.5" fill="url(#pnnCrimson)" filter="url(#pnnDrop)" />
    <text
      x="33"
      y="13.5"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
      font-weight="900"
      font-size="12"
      letter-spacing="2.2"
      fill="#FFFFFF"
      text-anchor="middle"
    >NEWS</text>

    <!-- NETWORK in Broadcast Gold -->
    <text
      x="76"
      y="13.8"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
      font-weight="900"
      font-size="12"
      letter-spacing="3.5"
      fill="url(#pnnGold)"
    >NETWORK</text>

    <!-- Separator Dot -->
    <circle cx="176" cy="9.5" r="2" fill="#FF1E27" />

    <!-- Domain Callout -->
    <text
      x="185"
      y="13.2"
      font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', monospace, sans-serif"
      font-weight="700"
      font-size="9.5"
      letter-spacing="1"
      fill="#9CC2E0"
    >PROLIFIC.NEWS</text>
  </g>
</svg>
