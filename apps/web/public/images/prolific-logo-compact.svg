<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#E6A800" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Shield / Badge -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Base hexagon / shield -->
    <path d="M 28 2 L 52 14 L 52 44 L 28 56 L 4 44 L 4 14 Z" fill="url(#shieldGrad)" />
    <!-- Inner inset -->
    <path d="M 28 6 L 48 16 L 48 42 L 28 52 L 8 42 L 8 16 Z" fill="#00233D" />
    <!-- Stylized "P" -->
    <path d="M 20 18 L 32 18 C 37 18 40 21 40 26 C 40 31 37 34 32 34 L 25 34 L 25 43 L 20 43 Z M 25 23 L 25 29 L 31 29 C 33 29 35 28 35 26 C 35 24 33 23 31 23 Z" fill="url(#shieldGrad)" />
    <!-- Signal arc / pulse dot -->
    <circle cx="28" cy="48" r="2.5" fill="#E50914" />
  </g>

  <!-- Text: PROLIFIC -->
  <text x="74" y="38" font-family="'Oswald', 'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="1.5" fill="#FFFFFF">PROLIFIC</text>

  <!-- NEWS Badge -->
  <rect x="222" y="16" width="70" height="26" rx="4" fill="url(#redGrad)" filter="url(#shadow)" />
  <text x="257" y="34.5" font-family="'Oswald', 'Inter', sans-serif" font-weight="900" font-size="16" letter-spacing="1.8" fill="#FFFFFF" text-anchor="middle">NEWS</text>

  <!-- Subtitle: NETWORK -->
  <text x="75" y="54" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" letter-spacing="5" fill="#FFCC00">NETWORK</text>
  <circle cx="160" cy="51" r="2" fill="#E50914" />
  <text x="168" y="54" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="2" fill="#99B8D0">24/7 BROADCAST</text>
</svg>
