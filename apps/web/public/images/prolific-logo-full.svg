<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" width="460" height="96" role="img" aria-label="PNN - Prolific News Network - 24/7 Global Broadcast">
  <defs>
    <linearGradient id="pnnGoldFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE45E" />
      <stop offset="50%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#D49B00" />
    </linearGradient>
    <linearGradient id="pnnCrimsonFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B00008" />
    </linearGradient>
    <linearGradient id="pnnNavyFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00365E" />
      <stop offset="100%" stop-color="#001220" />
    </linearGradient>
    <filter id="pnnDropFull" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LEFT EMBLEM: PNN BROADCAST MONOGRAM CREST -->
  <g transform="translate(8, 8)" filter="url(#pnnDropFull)">
    <rect x="0" y="0" width="90" height="80" rx="12" fill="url(#pnnGoldFull)" />
    <rect x="3" y="3" width="84" height="74" rx="9.5" fill="url(#pnnNavyFull)" />

    <!-- Global Broadcast Grid Arcs -->
    <ellipse cx="45" cy="40" rx="35" ry="27" fill="none" stroke="#005088" stroke-width="1" stroke-dasharray="4 2.5" opacity="0.65" />
    <path d="M 10 24 Q 45 35 80 24" fill="none" stroke="#005088" stroke-width="0.9" opacity="0.5" />
    <path d="M 10 56 Q 45 45 80 56" fill="none" stroke="#005088" stroke-width="0.9" opacity="0.5" />

    <!-- Top Crimson Broadcast Signal Bar -->
    <rect x="13" y="9" width="64" height="5" rx="2.5" fill="url(#pnnCrimsonFull)" />
    <circle cx="77" cy="11.5" r="3" fill="#FFE45E" />

    <!-- Pure Vector "PNN" Interlocking Monogram -->
    <!-- Letter P -->
    <path d="M 11 21 H 23 C 28 21 31 24 31 28.8 C 31 33.6 28 36.6 23 36.6 H 17.6 V 48 H 11 V 21 Z M 17.6 26.5 V 31.2 H 22 C 23.9 31.2 25 30.2 25 28.8 C 25 27.4 23.9 26.5 22 26.5 H 17.6 Z" fill="#FFFFFF" />
    <!-- First Letter N -->
    <path d="M 33.5 21 H 39.8 L 48.5 36.2 V 21 H 54.5 V 48 H 48.2 L 39.5 32.8 V 48 H 33.5 V 21 Z" fill="url(#pnnGoldFull)" />
    <!-- Second Letter N -->
    <path d="M 57.5 21 H 63.8 L 72.5 36.2 V 21 H 78.5 V 48 H 72.2 L 63.5 32.8 V 48 H 57.5 V 21 Z" fill="url(#pnnGoldFull)" />

    <!-- Bottom Micro-Banner inside Crest -->
    <rect x="12" y="54" width="66" height="15" rx="4" fill="#000D18" stroke="#004C80" stroke-width="1" />
    <circle cx="20.5" cy="61.5" r="3" fill="#FF1E27" />
    <text x="49" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="9.5" letter-spacing="1.5" fill="#FFE45E" text-anchor="middle">24/7 LIVE</text>
  </g>

  <!-- RIGHT LOCKUP: STACKED 2-TIER BROADCAST WORDMARK -->
  <!-- TIER 1 (TOP): PROLIFIC -->
  <text
    x="114"
    y="46"
    textLength="250"
    lengthAdjust="spacing"
    font-family="'Oswald', 'Arial Black', 'Segoe UI', Impact, system-ui, sans-serif"
    font-weight="900"
    font-size="38"
    fill="#FFFFFF"
    filter="url(#pnnDropFull)"
  >PROLIFIC</text>

  <!-- Top-Right Global Authority Pill -->
  <g transform="translate(374, 20)">
    <rect x="0" y="0" width="76" height="22" rx="4" fill="#001526" stroke="#005088" stroke-width="1.2" />
    <circle cx="11" cy="11" r="3" fill="#10B981" />
    <text x="44" y="14.8" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="9.5" letter-spacing="1.2" fill="#A3CBE8" text-anchor="middle">WORLDWIDE</text>
  </g>

  <!-- Gold Precision Divider Rule -->
  <line x1="114" y1="54.5" x2="450" y2="54.5" stroke="url(#pnnGoldFull)" stroke-width="1.5" opacity="0.8" />

  <!-- TIER 2 (BOTTOM): [ NEWS ] + NETWORK + 24/7 BROADCAST -->
  <g transform="translate(114, 61)">
    <!-- Crimson Broadcast NEWS Ribbon -->
    <rect x="0" y="0" width="84" height="24" rx="4" fill="url(#pnnCrimsonFull)" filter="url(#pnnDropFull)" />
    <text
      x="42"
      y="17"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
      font-weight="900"
      font-size="15"
      letter-spacing="2.8"
      fill="#FFFFFF"
      text-anchor="middle"
    >NEWS</text>

    <!-- NETWORK in Broadcast Gold -->
    <text
      x="96"
      y="17.2"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
      font-weight="900"
      font-size="15"
      letter-spacing="4"
      fill="url(#pnnGoldFull)"
    >NETWORK</text>

    <!-- Separator Dot -->
    <circle cx="218" cy="12" r="2.5" fill="#FF1E27" />

    <!-- Domain Callout -->
    <text
      x="229"
      y="16.5"
      font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', monospace, sans-serif"
      font-weight="800"
      font-size="11.5"
      letter-spacing="1.2"
      fill="#9CC2E0"
    >PROLIFIC.NEWS</text>
  </g>
</svg>
