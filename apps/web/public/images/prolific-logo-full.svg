<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="shieldGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#E6A800" />
    </linearGradient>
    <linearGradient id="redGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <filter id="shadowFull" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Emblem Shield / Badge -->
  <g transform="translate(10, 10)" filter="url(#shadowFull)">
    <!-- Base hexagon / shield -->
    <path d="M 35 2 L 66 18 L 66 54 L 35 70 L 4 54 L 4 18 Z" fill="url(#shieldGradFull)" />
    <!-- Inner inset -->
    <path d="M 35 7 L 61 21 L 61 51 L 35 64 L 9 51 L 9 21 Z" fill="#001F35" />
    <!-- Stylized "P" -->
    <path d="M 24 22 L 40 22 C 46 22 50 26 50 32 C 50 38 46 42 40 42 L 31 42 L 31 54 L 24 54 Z M 31 29 L 31 36 L 39 36 C 42 36 44 35 44 32 C 44 30 42 29 39 29 Z" fill="url(#shieldGradFull)" />
    <!-- Signal pulse dot -->
    <circle cx="35" cy="58" r="3" fill="#E50914" />
  </g>

  <!-- Text: PROLIFIC -->
  <text x="96" y="48" font-family="'Oswald', 'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="2" fill="#FFFFFF">PROLIFIC</text>

  <!-- NEWS Badge -->
  <rect x="282" y="20" width="88" height="34" rx="5" fill="url(#redGradFull)" filter="url(#shadowFull)" />
  <text x="326" y="44.5" font-family="'Oswald', 'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="2.2" fill="#FFFFFF" text-anchor="middle">NEWS</text>

  <!-- Subtitle: NETWORK -->
  <text x="98" y="70" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="6" fill="#FFCC00">NETWORK</text>
  <circle cx="215" cy="66" r="2.5" fill="#E50914" />
  <text x="226" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="2.5" fill="#88A8C0">24/7 DIGITAL BROADCAST</text>
</svg>
